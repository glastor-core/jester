[workspace]
resolver = "3"
members = [
    "crates/zerho-core",
    "crates/zerho-config",
    "crates/zerho-resolver",
    "crates/zerho-graph",
    "crates/zerho-plugin",
    "crates/zerho-transform",
    "crates/zerho-server",
    "crates/zerho-bundler",
    "crates/zerho-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Zero-Node, 100% Rust frontend dev server and production bundler"

[workspace.dependencies]
# Internal crates
zerho-core = { path = "crates/zerho-core" }
zerho-config = { path = "crates/zerho-config" }
zerho-resolver = { path = "crates/zerho-resolver" }
zerho-graph = { path = "crates/zerho-graph" }
zerho-plugin = { path = "crates/zerho-plugin" }
zerho-transform = { path = "crates/zerho-transform" }
zerho-server = { path = "crates/zerho-server" }
zerho-bundler = { path = "crates/zerho-bundler" }

# Phase 1 native Rust toolchain crates
blake3 = "1"
oxc = { version = "0.143", default-features = false, features = [
    "ast_visit",
    "semantic",
    "transformer",
    "codegen",
    "minifier",
    "mangler",
] }
oxc_resolver = "11"
lightningcss = "1.0.0-alpha.72"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "fs",
    "signal",
    "io-util",
] }
notify = "8"
wasmtime = { version = "29", default-features = false, features = [
    "cranelift",
    "runtime",
] }
sha2 = "0.10"
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
rayon = "1"
redb = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
