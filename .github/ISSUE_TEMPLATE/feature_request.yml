name: "Solicitud de Funcionalidad"
description: "Propón una nueva capacidad del compilador, bundler, dev server o ecosistema WASM para GLASTOR® zerho"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudar a evolucionar **GLASTOR® zerho** (`glastor-core/jester`)!
        Priorizamos propuestas 100% nativas en Rust (`unsafe_code = "forbid"`), sin dependencias de Node.js y con impacto medible en DX o rendimiento.

  - type: dropdown
    id: category
    attributes:
      label: "Área o Módulo Principal"
      description: "Selecciona el área técnica donde encaja esta propuesta."
      options:
        - "Compilador & Assets (oxc, lightningcss, WebP, SVG, Workers, .wasm)"
        - "Dev Server & HMR (Fast Refresh, /__inspect, Proxy, Partial Bundling)"
        - "Bundler & Targets (Scope Hoisting, MPA, Library Mode, Edge SSR)"
        - "Caché & Rendimiento (redb, Remote Team Cache, rayon)"
        - "Plugins WASM (wasmtime, WIT zerho:plugin@0.1.0)"
        - "Migración & CLI (zerho migrate, zerho check, zerho bench)"
        - "Seguridad (SRI, CSP, Secret Guard, Budgets)"
        - "Otro"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problema o Caso de Uso"
      description: "¿Qué necesidad real o brecha frente a Vite/Rspack/esbuild resuelve esta propuesta?"
      placeholder: "Al migrar una app React + TypeScript con..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Propuesta de Solución"
      description: "¿Cómo debería configurarse en zerho.toml o ejecutarse en el CLI?"
      placeholder: "Añadir opción `[build].target` o flag CLI..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Contexto Adicional / Especificaciones"
      description: "Enlaces a RFCs, especificaciones web o benchmarks de referencia."
