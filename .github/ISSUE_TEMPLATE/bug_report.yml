name: "Reporte de Bug"
description: "Reporta un fallo en compilación, HMR, bundling, SSR, WASM plugins o CLI de GLASTOR® zerho"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este problema en **GLASTOR® zerho** (`glastor-core/jester`).
        Por favor usa únicamente ejemplos mínimos reproducibles sin credenciales ni secretos reales.

  - type: textarea
    id: summary
    attributes:
      label: "Descripción del fallo"
      description: "Explica de forma concisa qué falló o qué comportamiento inesperado ocurrió."
      placeholder: "Ejemplo: zerho build --ssr no resuelve un alias de tsconfig.json o HMR no invalida un módulo CSS..."
    validations:
      required: true

  - type: dropdown
    id: module_area
    attributes:
      label: "Crate o Área Afectada"
      description: "¿Qué parte de zerho presentó el problema?"
      options:
        - "zerho-transform (oxc TS/JSX, Scope Hoisting, Minifier, CJS, Workers, CSS/SVG)"
        - "zerho-bundler (rayon, Shared Chunks, MPA, SSR Edge, WebP, SRI/CSP, stats.html)"
        - "zerho-server (axum dev server, HMR, /@zerho/bundle, /__inspect, PreviewServer)"
        - "zerho-resolver (oxc_resolver, tsconfig paths, node_modules)"
        - "zerho-graph (module graph, DFS cycles, redb cache, remote cache)"
        - "zerho-plugin (wasmtime host, UTF-8 string ABI, WIT contract)"
        - "zerho-config (zerho.toml, JSON Schema)"
        - "zerho-cli (init, migrate, dev, build, check, preview, bench)"
        - "website (zerho.xyz Astro portal)"
        - "Otro / General"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "Comando o proyecto mínimo reproducible."
      placeholder: |
        1. Ejecutar `zerho build --config zerho.toml`
        2. Observar el error o salida generada...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Entorno de Ejecución"
      description: "Versión de zerho, rustc y sistema operativo."
      placeholder: |
        - zerho version: 0.9.0
        - rustc: 1.96.1
        - OS: Ubuntu 24.04 / Windows 11 / macOS 15
    validations:
      required: true
