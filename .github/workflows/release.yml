name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: zerho-linux-x86_64.tar.gz
            bin: zerho
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zerho-macos-arm64.tar.gz
            bin: zerho
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zerho-windows-x86_64.zip
            bin: zerho.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p zerho-cli

      - name: Audit release binary with GLASTOR Byte-Gauge (Linux)
        if: runner.os == 'Linux'
        uses: glastor-core/byte-gauge@2a6fca514168a8e825925d94ad19ab6e4725e336 # v1
        with:
          file-path: "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          max-size-mb: "25"
          output-sbom: "zerho-${{ matrix.target }}.sbom.cdx.json"
          post-pr-comment: "false"

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.bin }}
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            zerho-*.sbom.cdx.json
