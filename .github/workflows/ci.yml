name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (pedantic)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p zerho-cli

      - name: Smoke test check, production, SSR and bench
        shell: bash
        run: |
          ./target/release/zerho check --config examples/basic-ts/zerho.toml
          ./target/release/zerho build --config examples/basic-ts/zerho.toml --analyze
          ./target/release/zerho build --config examples/basic-ts/zerho.toml --ssr
          ./target/release/zerho build --config examples/react-tsx/zerho.toml
          ./target/release/zerho bench --synthetic 20 --json > /dev/null

  wasm-plugin-example:
    name: WASM Plugin Example (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/wasm-plugin

      - name: Build example WASM plugin
        run: cargo build --manifest-path examples/wasm-plugin/Cargo.toml --target wasm32-unknown-unknown --release

  website:
    name: Website (Astro build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Build Astro static site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm --prefix website run build

  e2e-real-npm:
    name: Real NPM E2E (React + Zustand + Lucide)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js (for real npm package installation)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install real React + Zustand + Lucide packages
        run: |
          mkdir -p /tmp/zerho-real-npm-app
          cd /tmp/zerho-real-npm-app
          npm init -y > /dev/null
          npm install --no-audit --no-fund react react-dom zustand lucide-react

      - name: Run real npm E2E test (Rust + HTTP)
        env:
          ZERHO_REAL_NPM_APP_DIR: /tmp/zerho-real-npm-app
        run: cargo test -p zerho-cli --test e2e_real_apps e2e_real_npm_react_zustand_lucide -- --ignored --nocapture

      - name: Verify live React 19 + Zustand + Lucide in real Chromium (zerho dev & preview)
        run: |
          cargo build -p zerho-cli
          cat > /tmp/zerho-real-npm-app/zerho.toml << 'EOF'
          [project]
          name = "real-npm-e2e"
          root = "."
          entry = "src/main.tsx"
          framework = "react"

          [build]
          out_dir = "dist"
          base = "/"
          empty_out_dir = true
          minify = true
          brotli = true
          EOF
          ./target/debug/zerho build --config /tmp/zerho-real-npm-app/zerho.toml

          ./target/debug/zerho preview --config /tmp/zerho-real-npm-app/zerho.toml --port 4199 &
          PREV_PID=$!
          sleep 1
          node scripts/verify-chromium-e2e.mjs http://127.0.0.1:4199/
          kill $PREV_PID || true

          ./target/debug/zerho dev --config /tmp/zerho-real-npm-app/zerho.toml --port 5199 &
          DEV_PID=$!
          sleep 2
          node scripts/verify-chromium-e2e.mjs http://127.0.0.1:5199/
          kill $DEV_PID || true
