name: DevSecOps Audit (GLASTOR Core)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  specter:
    name: Specter — API Contract & SemVer Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run GLASTOR Specter AST Contract Audit
        uses: glastor-core/specter@e1f16c27f34987429a1ba6a84d871fa1c79c79f1 # v1
        timeout-minutes: 5
        continue-on-error: true
        with:
          head-dir: "crates"
          base-ref: "origin/main"
          fail-on-breaking: "false"
          fail-on-trojan: "true"
          output-sarif: "specter-report.sarif"
          output-sbom: "specter-sbom.cdx.json"
          post-pr-comment: "true"

      - name: Upload Specter SARIF
        if: always() && hashFiles('specter-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v3
        with:
          sarif_file: specter-report.sarif
          category: specter-api-contract
        continue-on-error: true

  byte-gauge:
    name: Byte-Gauge — Binary Hardening & Size Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release -p zerho-cli

      - name: Run GLASTOR Byte-Gauge Binary Audit
        uses: glastor-core/byte-gauge@2a6fca514168a8e825925d94ad19ab6e4725e336 # v1
        with:
          file-path: "target/release/zerho"
          max-size-mb: "25"
          max-entropy: "7.5"
          fail-on-debug: "false"
          output-sarif: "byte-gauge-report.sarif"
          output-sbom: "byte-gauge-sbom.cdx.json"
          post-pr-comment: "true"

      - name: Upload Byte-Gauge SARIF
        if: always() && hashFiles('byte-gauge-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v3
        with:
          sarif_file: byte-gauge-report.sarif
          category: byte-gauge-binary-audit
        continue-on-error: true

  pii-veil:
    name: pii-veil — DLP Secret & PII Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run GLASTOR pii-veil DLP Scan
        uses: glastor-core/pii-veil@5f31d0dbe4fd02fbc0edf395bd4dcd7571f52117 # v0.1.4
        with:
          path: "crates"
          exclude: "security.rs,e2e_real_apps.rs"
          fail-on-detect: "false"

  nemesis:
    name: Nemesis — DevSecOps Hygiene & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run GLASTOR Nemesis Universal Auditor
        uses: glastor-core/nemesis@c0a69644f3a705a9653f17b899c2f62095be4972 # v1 (Trivy v0.76.2)
        with:
          target-path: "."
          scan-secrets: "true"
          scan-sast: "true"
          scan-sca: "true"
          scan-hygiene: "true"
          scan-licenses: "true"
          generate-sbom: "true"
          require-license: "true"
          fail-on-critical: "true"
          fail-on-high: "false"
          post-pr-comment: "true"
          upload-sarif: "true"
