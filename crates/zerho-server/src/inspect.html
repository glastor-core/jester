<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zerho — Module Graph Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Mono:wght@400;600&family=Red+Hat+Text:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d14;
      --surface: #111827;
      --surface-2: #182235;
      --border: #24324a;
      --accent: #f97316;
      --ok: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Red Hat Text", system-ui, sans-serif;
      padding: 2rem;
      max-width: 1120px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      font-family: "Red Hat Display", sans-serif;
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h1 .material-symbols-outlined { color: var(--accent); font-size: 2rem; }
    .pill {
      font-family: "Red Hat Mono", monospace;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent);
      color: #090d14;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-family: "Red Hat Mono", monospace;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      display: grid;
      gap: 0.4rem;
    }
    .kpi-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .kpi-value {
      font-family: "Red Hat Mono", monospace;
      font-size: 1.75rem;
      font-weight: 600;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h2 {
      font-family: "Red Hat Display", sans-serif;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.8rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    td.mono { font-family: "Red Hat Mono", monospace; font-size: 0.85rem; }
    .tag {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-family: "Red Hat Mono", monospace;
      font-size: 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .empty { padding: 2rem; text-align: center; color: var(--muted); }
    .treemap-panel { margin-top: 1.5rem; padding: 1.25rem; }
    .treemap-row { margin-bottom: 0.75rem; }
    .treemap-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.3rem; font-size: 0.85rem; }
    .bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #f97316, #fb923c); border-radius: 999px; }
    .search-box { width: 100%; margin-bottom: 1rem; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: "Red Hat Mono", monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><span class="material-symbols-outlined">hub</span> zerho inspector</h1>
      <span class="pill" id="meta">loading...</span>
    </div>
    <button id="refresh-btn"><span class="material-symbols-outlined">refresh</span> Refresh</button>
  </header>

  <section class="grid">
    <div class="kpi">
      <div class="kpi-label"><span class="material-symbols-outlined">layers</span> Modules</div>
      <div class="kpi-value" id="k-modules">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="material-symbols-outlined">share</span> Graph Edges</div>
      <div class="kpi-value" id="k-edges">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="material-symbols-outlined">database</span> Cache Hits</div>
      <div class="kpi-value" id="k-hits">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="material-symbols-outlined">bolt</span> Hit Rate</div>
      <div class="kpi-value" id="k-rate">0%</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2><span class="material-symbols-outlined">memory</span> Incremental Module Graph</h2>
      <span class="pill">blake3 content-addressed</span>
    </div>
    <div id="table-wrap"></div>
  </section>

  <section class="panel treemap-panel">
    <div class="panel-header" style="padding: 0 0 1rem; margin-bottom: 1rem;">
      <h2><span class="material-symbols-outlined">account_tree</span> Live Bundle Treemap</h2>
      <span class="pill" id="treemap-total">0.00 KB</span>
    </div>
    <input id="treemap-filter" class="search-box" type="search" placeholder="Filter modules in live treemap..." />
    <div id="treemap-wrap"></div>
  </section>

  <script type="module">
    let latestItems = [];
    function renderTreemap(items, term = "") {
      const wrap = document.getElementById("treemap-wrap");
      const filtered = items
        .filter(m => !term || m.path.toLowerCase().includes(term))
        .slice()
        .sort((a, b) => (b.bytes || 0) - (a.bytes || 0));
      const total = items.reduce((acc, m) => acc + (m.bytes || 0), 0);
      document.getElementById("treemap-total").textContent = `${(total / 1024).toFixed(2)} KB total`;
      if (filtered.length === 0) {
        wrap.innerHTML = `<div class="empty">No matching modules in live treemap.</div>`;
        return;
      }
      const denom = Math.max(total, 1);
      wrap.innerHTML = filtered.map(m => {
        const b = m.bytes || 0;
        const pct = ((b / denom) * 100).toFixed(1);
        const width = Math.max(4, Math.min(100, Math.round((b / denom) * 100)));
        return `<div class="treemap-row">
          <div class="treemap-meta">
            <span class="mono">${m.path}</span>
            <span class="mono" style="color:var(--muted)">${(b / 1024).toFixed(2)} KB (${pct}%)</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
        </div>`;
      }).join("");
    }

    async function load() {
      const res = await fetch("/__inspect/api");
      const data = await res.json();
      latestItems = data.items || [];
      document.getElementById("meta").textContent = `${data.project} · ${data.framework} · Zero-Node Rust`;
      document.getElementById("k-modules").textContent = data.modules;
      document.getElementById("k-edges").textContent = data.edges;
      document.getElementById("k-hits").textContent = `${data.cache_hits} / ${data.cache_hits + data.cache_misses}`;
      const total = data.cache_hits + data.cache_misses;
      const rate = total === 0 ? 0 : Math.round((data.cache_hits / total) * 100);
      document.getElementById("k-rate").textContent = `${rate}%`;

      const wrap = document.getElementById("table-wrap");
      if (latestItems.length === 0) {
        wrap.innerHTML = `<div class="empty">No modules loaded yet. Open <code>/</code> to populate the incremental graph.</div>`;
        renderTreemap([]);
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead>
            <tr><th>Module Path</th><th>Kind</th><th>Size</th><th>blake3</th><th>Imports</th><th>Importers</th></tr>
          </thead>
          <tbody>
            ${latestItems.map(m => `
              <tr>
                <td class="mono">${m.path}</td>
                <td><span class="tag">${m.kind}</span></td>
                <td class="mono">${((m.bytes || 0) / 1024).toFixed(2)} KB</td>
                <td class="mono">${m.hash}</td>
                <td class="mono">${m.imports}</td>
                <td class="mono">${m.importers}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      renderTreemap(latestItems, document.getElementById("treemap-filter").value.trim().toLowerCase());
    }
    document.getElementById("refresh-btn").addEventListener("click", load);
    document.getElementById("treemap-filter").addEventListener("input", (e) => {
      renderTreemap(latestItems, e.target.value.trim().toLowerCase());
    });
    load();
  </script>
</body>
</html>
