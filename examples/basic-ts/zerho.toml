[project]
name = "basic-ts"
root = "."
entry = "src/main.ts"
framework = "vanilla"

[server]
host = "127.0.0.1"
port = 5173
hmr = true
open = false

[build]
out_dir = "dist"
minify = true
sourcemap = "linked"
target = "es2022"
splitting = true

[css]
modules = false
minify = true

[cache]
enabled = true
dir = ".zerho/cache"
